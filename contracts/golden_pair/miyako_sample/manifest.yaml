# ============================================================
# golden_pair/miyako_sample/manifest.yaml —— 共享黄金样例（R1 互锁机制）
# 底稿 = pet 仓实物 miyako.char/manifest.yaml（2026-09 产线雏形实测），
# life 强制追加：voice_tier（伪码 2/1/0，pack 落盘）。
# 同一份样例必须同时过 life schema（contracts/char_schema/，test_char_schema 执法）
# 与 pet 侧模板校验（tools/new_character.py 同构；人工跑一次留证，plan L0.2）。
# ============================================================
package_id: miyako
schema_version: 1
package_version: 1.0.1
spec_version: miyako_v1.9
generated_by: scripts/build_char_package.py（产线幂等构建）+ pet tools/compose_all_sprites.py（立绘全枚举合成，2026-09-13 生产链裁决：E2 验收 + pack 直通）
character_package_dir: data/characters/miyako.char
voice_tier: 2                  # life 强制：参考池 + dataset 双备 → 2（§0.4 伪码）
source:
  voice_map:
    path: scn/voice_map.json
    sha256: d319f4bd1127197eee36e33071a1f64445ddf362c964635b2c1bdaa62d5ffd29
    entries: 2098
  voice_dir:
    path: voice/my
    ogg_count: 2106
  sprites_dir:
    path: miyako_life材料库/fgimage/sprites_pkg（E2 生产源=材料库归档，compose_dir 可覆盖）
    png_count: 166
  sprites_manifest_note: sprites/manifest.json = pet compose_all_sprites 产物原样直通
    （闭集三元组 156 / expressions_extra 6 / accessories 6；E2 v2 验收，2026-09-13）
assets:
  sprite:
    manifest: sprites/manifest.json
    format: png/rgba
    axes:
      expression:
      - normal
      - happy
      - shy
      - pout
      - angry
      - sad
      - surprise
      - thinking
      - sleepy
      costume:
      - casual
      - uniform
      - waitress
      - parka
      - naked
      pose:
      - A
      - B
      - C
      - D
    coverage_note: 全枚举后查表（default=casual 别名）：A=stand 缺 sad、B=right 缺 sleepy、
      C=left 全覆盖、D=back 仅 normal——查表缺项由 sprite_manager 逐级 fallback normal；
      闭集外差分入 sprites/manifest.json 的 expressions_extra，饰品独立层入 accessories
  live2d:
    enabled: false
    note: 预留资产节（设计文档 7.9）；触发升级见附录 A 翻案条款
  reference_audio:
    candidates_meta: reference_audio/candidates.yaml
    candidates_count: 10
    dataset_list: reference_audio/dataset/miyako.list
    dataset_clips: 1459
    final_review: pending（不在本工单内）
  audiofile:
    root: audiofile
    buckets:
    - normal
    - happy
    - shy
    - pout
    - angry
    - sad
    - surprise
    - thinking
    - sleepy
    clips_per_bucket_cap: 20
    counts:
      normal: 20
      happy: 20
      shy: 20
      pout: 20
      angry: 19
      sad: 20
      surprise: 20
      thinking: 20
      sleepy: 0
    empty_buckets:
    - sleepy
emotion_map:
  note: 游戏 face 标签 -> 9 元闭集；未知/缺失 fallback normal（硬约束）；权威表=contracts/face_map.yaml
  face_to_emotion:
    通常: normal
    真面目: normal
    微笑: happy
    笑み: happy
    にっこり: happy
    うふふ: happy
    ウインク: happy
    苦笑: shy
    うっとり: shy
    キス: shy
    拗ね: pout
    ふふん: pout
    怒り: angry
    ぷんすか: angry
    説教: angry
    悲しみ: sad
    不安: sad
    驚き: surprise
    慌て: surprise
    きょとん: thinking
    ジト目: thinking
first_person_stat:
  私: 211
  わたし: 0
  あたし: 0
  うち: 16
  僕: 0
  俺: 1
fallbacks:
  unknown_emotion: normal
  empty_audiofile_bucket: normal
game_assets_note: sprites/*.png、reference_audio/**、audiofile/** 为游戏版权物料：不进 git 与发布包（主项目 .gitignore
  与 make_release 排除清单；产线同策略）。主项目侧接入记录（2026-09）：sprites 闭集三元组 156
  （pet 全枚举合成，E2 验收 demand 1330 exact=1.0）、audiofile 9 桶 159 条预录、
  reference_audio/candidates 10 条推理参考（训练集 dataset/ 留产线未接入）。
